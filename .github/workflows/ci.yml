name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          HUSKY: 0
      - run: npm run lint -- --deny-warnings
      - run: npm run format:check
      - run: npm test -w backend
      - run: npm run build
